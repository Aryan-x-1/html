<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact info</title>
    <style>
        h3{
            text-align: right;
            color: blue;
            font-family: Arial, serif;
        }
        p{
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        table{
            width: 50%;
            margin: auto;
            border-collapse: collapse;
        }
        table,th,td{
            border: 2px solid black;
        }
        th,td{
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h3>Akshay Technologies</h3>
    <p>your trusted partner for all your technology needs</p>
    <table>
        <tr>
            <th>Department</th>
            <th>Contact Number</th>
        </tr>
        <tr>
            <td>Sales</td>
            <td>1111111111</td>
        <tr>
            <td>Customer Support</td>
            <td>2222222222</td>    
    </table>
</body>
</html>
