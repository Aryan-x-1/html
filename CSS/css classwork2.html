<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .outer {
            border: 5px solid black;
            padding: 30px;
            width: 300px;
            margin: 50px auto;
        }
        .middle {
            border: 5px solid red;
            padding: 20px;
          
        }
        .inner {
            border: 5px solid blue;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="outer">
        Outer div
        <div class="middle">
            Middle div
            <div class="inner">
                Inner div
            </div>
        </div>
    </div>
</body>
</html>
