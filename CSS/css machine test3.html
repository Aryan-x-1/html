<!DOCTYPE html>
<html>

<head>

    <title>Responsive Login Page</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="left">

        </div>

        <div class="right">

            <h2>Login Form</h2>

            <form>

                <label for="email">
                    Email :
                </label>

                <input
                type="text"
                id="email"
                required>

                <label for="password">
                    Password :
                </label>

                <input
                type="password"
                id="password" required>

                <div class="remember">

                    <input
                    type="checkbox"
                    id="remember">

                    <label for="remember">
                        Remember Me
                    </label>

                </div>

                <button type="submit">

                    Login

                </button>

            </form>

        </div>

    </div>

</body>

</html>
