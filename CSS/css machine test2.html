<!DOCTYPE html>
<html>

<head>

    <title>Button Link</title>

    <style>

        body{
            text-align:center;
            margin-top:200px;
            font-family:Arial;
        }

        a{
            background-color:royalblue;

            text-decoration:none;

            display:inline-block;

        }

    </style>

</head>

<body>

    <a href="https://www.google.com">Click Here</a>

</body>

</html>
