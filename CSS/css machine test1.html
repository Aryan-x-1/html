<!DOCTYPE html>
<html>

<head>

    <title>Product Table</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        .container{
            text-align:center;
        }

        table{
            border:2px solid black;
            border-collapse:collapse;
            width:100%;
        }

        th,td{
            border:2px solid black;
            background-color:grey;
            color:white;
            padding:10px;
            text-align:center;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Product Details</h2>

        <table>

            <tr>
                <th>Id</th>
                <th>Product Name</th>
                <th>Product Price</th>
            </tr>

            <tr>
                <td>101</td>
                <td>Wireless Mouse</td>
                <td>&#8377;500</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Keyboard</td>
                <td>&#8377;1000</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Headphones</td>
                <td>&#8377;5000</td>
            </tr>

            <tr>
                <td>104</td>
                <td>Monitor</td>
                <td>&#8377;15000</td>
            </tr>

            <tr>
                <td>105</td>
                <td>Web Camera</td>
                <td>&#8377;6000</td>
            </tr>

        </table>

    </div>

</body>

</html>
