<!DOCTYPE html>
<html>

<head>
    <title>Product Card</title>

    <style>

        .card{
            border: 3px solid blue;
            border-radius: 15px;
            padding: 20px;
            margin: 30px auto;
            width: 40%;
            height: 400px;
        }

        img{
            max-width:100%;
            min-width:200px;
            height:200px;
        }

        h2{
            text-align:center;
        }

    </style>

</head>

<body>

    <div class="card">

        <img src="https://www.headphonezone.in/cdn/shop/files/Headphone-zone-Sennheiser-HDB-630-01jpg.jpg?v=1763619059&width=800" alt="Wireless Headphones">

        <h2>Wireless Headphones</h2>

        <p>
            These wireless headphones provide excellent sound quality,
            long battery life and comfortable ear cushions for daily use.
        </p>

    </div>

</body>

</html>
