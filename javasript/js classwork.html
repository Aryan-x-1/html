<!DOCTYPE html>
<html>
<head>
    <title>Store Sales</title>
</head>

<body>

    <h1>Store Sales</h1>

    <script>
        var tShirts = 5;
        var tShirtPrice = 400;

        var caps = 3;
        var capPrice = 150;

        var total = (tShirts * tShirtPrice) + (caps * capPrice);

        document.write("Total earnings: ₹" + total + "<br>");

        tShirtPrice = 450;

        total = (tShirts * tShirtPrice) + (caps * capPrice);

        document.write("Updated total earnings: ₹" + total);
    </script>

</body>
</html>
