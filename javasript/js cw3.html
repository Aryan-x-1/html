<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="feedback" type="text">

<button onclick="processFeedback()">Submit</button>

<p id="output"></p>
<script>
    function processFeedback() {

    var feedback = document.getElementById("feedback").value;

    feedback = feedback.trim();

    feedback = feedback.toLowerCase();

    feedback = feedback.replace("food", "ambience");

    var position = feedback.indexOf("service");

    var words = feedback.split(" ");

    document.getElementById("output").innerHTML =
        "Clean feedback: " + feedback + "<br>" +
        "Position of service: " + position + "<br>" +
        "Array of words: " + words;
    }
</script>
</body>
</html>
