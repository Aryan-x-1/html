<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>My Gallery</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'script.js' %}" defer></script>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <div class="image-card">
            <img src="{% static 'image1.jpg' %}" alt="Mountain">
            <p>Beautiful Mountains</p>
        </div>

        <div class="image-card">
            <img src="{% static 'image2.jpg' %}" alt="Beach">
            <p>Peaceful Beach</p>
        </div>

        <div class="image-card">
            <img src="{% static 'image3.jpg' %}" alt="Forest">
            <p>Green Forest</p>
        </div>

    </div>

    <a href="{% url 'contact' %}">Contact Me</a>

</body>
</html>
